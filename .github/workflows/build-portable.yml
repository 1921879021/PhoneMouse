name: Build Portable EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  portable-win-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.400"

      - name: Build self-contained Portable EXE
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          else {
            $version = "0.7.2.3-alpha"
          }

          ./scripts/Publish-Portable.ps1 -Version $version

      - name: Upload Portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMouse-Portable-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256.txt
          if-no-files-found: error

      - name: Create GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts/*.zip `
            artifacts/*.sha256.txt `
            --title "Phone Mouse ${{ github.ref_name }}" `
            --generate-notes
